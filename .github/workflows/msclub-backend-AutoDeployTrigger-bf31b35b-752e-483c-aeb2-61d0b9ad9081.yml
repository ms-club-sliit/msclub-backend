name: Trigger auto deployment for msclub-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ staging ]
    paths:
    - '**'
    - '.github/workflows/msclub-backend-AutoDeployTrigger-bf31b35b-752e-483c-aeb2-61d0b9ad9081.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MSCLUBBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MSCLUBBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MSCLUBBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.MSCLUBBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MSCLUBBACKEND_REGISTRY_PASSWORD }}
          containerAppName: msclub-backend
          resourceGroup: msclub
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


